
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b10">
  <meta name="description" content="Ashkan Rayat | ZEROCRYPT | Team Lead · OSINT">
  <title>Ashkan Rayat | ZEROCRYPT</title>

  <style>
    :root {
      --bg: #070b10;
      --panel: rgba(15, 25, 32, 0.76);
      --green: #00ffa6;
      --cyan: #63e8ff;
      --text: #e8f5f1;
      --muted: #8ba39e;
      --border: rgba(0, 255, 166, 0.19);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(0, 255, 166, 0.10), transparent 35%),
        radial-gradient(ellipse at 85% 75%, rgba(99, 232, 255, 0.08), transparent 38%),
        #070b10;
    }

    /* Animated background grid */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 255, 166, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 166, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .glow {
      position: fixed;
      z-index: -1;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.13;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow-one {
      top: 10%;
      left: -100px;
      background: var(--green);
    }

    .glow-two {
      right: -100px;
      bottom: 5%;
      background: var(--cyan);
      animation-delay: -5s;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(60px, -40px); }
    }

    .page {
      width: min(100% - 36px, 900px);
      margin: 0 auto;
      padding: 25px 0 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 2px 24px;
      animation: appear 0.8s ease both;
    }

    .brand {
      font: 800 15px monospace;
      letter-spacing: 3px;
    }

    .brand span {
      color: var(--green);
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font: 10px monospace;
      letter-spacing: 1.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.35; }
    }

    .profile-card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 58px) 24px 35px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: linear-gradient(
        140deg,
        rgba(18, 33, 39, 0.88),
        rgba(8, 14, 21, 0.88)
      );
      box-shadow:
        0 24px 90px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: appear 0.9s ease both;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--green),
        transparent
      );
      box-shadow: 0 0 20px var(--green);
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      opacity: 0.6;
    }

    .corner-tl {
      top: 15px;
      left: 15px;
      border-top: 1px solid var(--green);
      border-left: 1px solid var(--green);
    }

    .corner-tr {
      top: 15px;
      right: 15px;
      border-top: 1px solid var(--green);
      border-right: 1px solid var(--green);
    }

    .corner-bl {
      bottom: 15px;
      left: 15px;
      border-bottom: 1px solid var(--green);
      border-left: 1px solid var(--green);
    }

    .corner-br {
      bottom: 15px;
      right: 15px;
      border-bottom: 1px solid var(--green);
      border-right: 1px solid var(--green);
    }

    .identity-label {
      color: var(--muted);
      font: 10px monospace;
      letter-spacing: 4px;
      margin-bottom: 22px;
    }

    .emblem {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin: 0 auto 25px;
      border: 1px solid rgba(0, 255, 166, 0.42);
      border-radius: 24px;
      background: rgba(0, 255, 166, 0.045);
      box-shadow:
        0 0 35px rgba(0, 255, 166, 0.07),
        inset 0 0 25px rgba(0, 255, 166, 0.035);
      transform: rotate(-3deg);
      animation: emblem-float 5s ease-in-out infinite;
    }

    .emblem span {
      color: var(--green);
      font: 800 30px monospace;
      letter-spacing: -3px;
      transform: rotate(3deg);
      text-shadow: 0 0 22px rgba(0, 255, 166, 0.35);
    }

    @keyframes emblem-float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    h1 {
      max-width: 100%;
      color: #f1fff9;
      font-size: clamp(27px, 6vw, 47px);
      font-weight: 800;
      letter-spacing: clamp(1px, 0.7vw, 4px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .name-accent {
      color: var(--green);
    }

    .divider {
      width: 62px;
      height: 2px;
      margin: 24px auto;
      background: var(--green);
      box-shadow: 0 0 15px rgba(0, 255, 166, 0.75);
    }

    .role {
      color: #d1e6e0;
      font: 12px monospace;
      letter-spacing: 2px;
    }

    .role span {
      color: var(--green);
      padding: 0 5px;
    }

    .member-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: min(100%, 340px);
      margin: 30px auto 20px;
      padding: 17px 19px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.025);
    }

    .member-label {
      color: var(--muted);
      font: 10px monospace;
      letter-spacing: 1.5px;
    }

    .member-id {
      color: var(--green);
      font: 700 17px monospace;
      letter-spacing: 2px;
    }

    .team {
      color: var(--green);
      font: 800 13px monospace;
      letter-spacing: 7px;
      padding-left: 7px;
      text-shadow: 0 0 20px rgba(0, 255, 166, 0.15);
    }

    .team-caption {
      margin-top: 10px;
      color: #78928c;
      font: 9px monospace;
      letter-spacing: 2px;
    }

    .section {
      margin-top: 22px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: appear 1s ease both;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 20px;
      font: 700 12px monospace;
      letter-spacing: 2px;
    }

    .heading-mark {
      width: 8px;
      height: 8px;
      border: 1px solid var(--green);
      background: rgba(0, 255, 166, 0.25);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(0, 255, 166, 0.25);
    }

    .specialties {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .specialty {
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px 8px;
      border: 1px solid rgba(0, 255, 166, 0.12);
      border-radius: 13px;
      background: rgba(0, 255, 166, 0.025);
      text-align: center;
      transition: border-color 0.25s, background 0.25s,
                  transform 0.25s;
    }

    .specialty:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 255, 166, 0.42);
      background: rgba(0, 255, 166, 0.06);
    }

    .specialty-symbol {
      color: var(--green);
      font: 23px monospace;
    }

    .specialty-name {
      color: #c3d8d2;
      font: 10px monospace;
      letter-spacing: 1px;
    }

    .footer {
      padding: 27px 0 5px;
      text-align: center;
      color: #6c837e;
      font: 10px monospace;
      letter-spacing: 1.5px;
      line-height: 2;
    }

    .footer strong {
      color: var(--green);
      font-weight: 600;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .page {
        width: min(100% - 22px, 900px);
        padding-top: 15px;
      }

      header {
        padding-bottom: 18px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .top-status {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .profile-card {
        padding-left: 17px;
        padding-right: 17px;
        border-radius: 20px;
      }

      .section {
        padding: 20px 15px;
      }

      .specialties {
        gap: 7px;
      }

      .specialty {
        min-height: 95px;
        padding: 12px 4px;
      }

      .specialty-name {
        font-size: 9px;
        letter-spacing: 0;
      }

      .team {
        letter-spacing: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main class="page">
    <header>
      <div class="brand">ZERO<span>CRYPT</span></div>

      <div class="top-status">
        <span class="status-dot"></span>
        MEMBER PROFILE
      </div>
    </header>

    <section class="profile-card" aria-label="Member identity">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <p class="identity-label">IDENTITY PROFILE</p>

      <div class="emblem" aria-hidden="true">
        <span>ZC</span>
      </div>

      <h1>ASHKAN <span class="name-accent">RAYAT</span></h1>

      <div class="divider"></div>

      <p class="role">TEAM LEAD <span>·</span> OSINT</p>

      <div class="member-box">
        <span class="member-label">MEMBER ID</span>
        <strong class="member-id">ZC-003</strong>
      </div>

      <div class="team">ZEROCRYPT</div>
      <p class="team-caption">OPEN SOURCE INTELLIGENCE</p>
    </section>

    <section class="section">
      <h2 class="section-heading">
        <span class="heading-mark" aria-hidden="true"></span>
        FOCUS AREAS
      </h2>

      <div class="specialties">
        <div class="specialty">
          <span class="specialty-symbol" aria-hidden="true">⌕</span>
          <span class="specialty-name">OSINT</span>
        </div>

        <div class="specialty">
          <span class="specialty-symbol" aria-hidden="true">⌘</span>
          <span class="specialty-name">RESEARCH</span>
        </div>

        <div class="specialty">
          <span class="specialty-symbol" aria-hidden="true">▤</span>
          <span class="specialty-name">ANALYSIS</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>MEMBER ID <strong>ZC-003</strong></p>
      <p>© <span id="year">2026</span> ZEROCRYPT</p>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
